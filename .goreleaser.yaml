version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: .
    binary: tk
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: ["zip"]

brews:
  - name: tk
    directory: Formula
    repository:
      owner: nijaru
      name: homebrew-tap
      token: "{{ .Env.TAP_UPDATE_TOKEN }}"
    homepage: https://github.com/nijaru/tk
    description: "Minimal task tracker CLI"
    license: MIT
    test: |
      system "#{bin}/tk", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
