name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build and verify, no publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  # --- Pre-flight: all checks before any side effects ---
  preflight:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be X.Y.Z (got: $VERSION)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Error: tag v$VERSION already exists"
            exit 1
          fi

      - name: Check version not already on GitHub releases
        run: |
          if gh release view "v$VERSION" --repo nijaru/tk &>/dev/null; then
            echo "Error: release v$VERSION already exists on GitHub"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check npm versions not already published
        run: |
          # Check main wrapper
          if npm view "@nijaru/tk@$VERSION" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "Error: @nijaru/tk@$VERSION is already published on npm"
            exit 1
          fi
          # Check all platform packages
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm view "@nijaru/tk-${platform}@$VERSION" version 2>/dev/null | grep -qF "$VERSION"; then
              echo "Error: @nijaru/tk-${platform}@$VERSION is already published on npm"
              exit 1
            fi
          done

  # --- Build release binaries on native runners ---
  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tk_darwin_arm64.tar.gz
            bin: tk
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tk_darwin_amd64.tar.gz
            bin: tk
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tk_linux_amd64.tar.gz
            bin: tk
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tk_linux_arm64.tar.gz
            bin: tk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tk_windows_amd64.zip
            bin: tk.exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The binary reports CARGO_PKG_VERSION, so stamp it before building.
      - name: Stamp version
        shell: bash
        run: |
          sed -i.bak -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/s//version = "'"$VERSION"'"/' Cargo.toml \
            && rm Cargo.toml.bak
          grep -q "^version = \"$VERSION\"$" Cargo.toml

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/stage"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          mkdir -p dist/archives
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd "$STAGE" && (zip -q "../archives/${{ matrix.archive }}" * || powershell -Command "Compress-Archive -Path * -DestinationPath ../archives/${{ matrix.archive }}"))
          else
            tar -czf "dist/archives/${{ matrix.archive }}" -C "$STAGE" .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/archives/${{ matrix.archive }}
          if-no-files-found: error

  # --- Publish: tag, GitHub release, tap, npm ---
  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist/archives
          merge-multiple: true

      # --- Full CI suite (superset of ci.yml) ---

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # --- Version stamp + tag ---

      - name: Stamp Cargo.toml version
        if: ${{ !inputs.dry_run }}
        run: |
          sed -i -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/s//version = "'"$VERSION"'"/' Cargo.toml
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          cargo build # refresh Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git push origin HEAD:main
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Verify version flag
        run: |
          sed -E -i.bak '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/s//version = "'"$VERSION"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          cargo build --release
          OUTPUT=$(./target/release/tk --version)
          if ! echo "$OUTPUT" | grep -qF "$VERSION"; then
            echo "Error: binary reports '$OUTPUT', expected $VERSION"
            exit 1
          fi

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$VERSION" dist/archives/* \
            --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        if: ${{ !inputs.dry_run }}
        env:
          TAP_UPDATE_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/archives/$1" | cut -d' ' -f1; }
          SHA_DA=$(sha tk_darwin_arm64.tar.gz)
          SHA_DX=$(sha tk_darwin_amd64.tar.gz)
          SHA_LA=$(sha tk_linux_arm64.tar.gz)
          SHA_LX=$(sha tk_linux_amd64.tar.gz)
          git clone "https://x-access-token:${TAP_UPDATE_TOKEN}@github.com/nijaru/homebrew-tap.git" dist/tap
          cat > dist/tap/Formula/tk.rb <<EOF
          class Tk < Formula
            desc "Minimal task tracker CLI"
            homepage "https://github.com/nijaru/tk"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/nijaru/tk/releases/download/v$VERSION/tk_darwin_arm64.tar.gz"
                sha256 "$SHA_DA"
              end
              on_intel do
                url "https://github.com/nijaru/tk/releases/download/v$VERSION/tk_darwin_amd64.tar.gz"
                sha256 "$SHA_DX"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/nijaru/tk/releases/download/v$VERSION/tk_linux_arm64.tar.gz"
                sha256 "$SHA_LA"
              end
              on_intel do
                url "https://github.com/nijaru/tk/releases/download/v$VERSION/tk_linux_amd64.tar.gz"
                sha256 "$SHA_LX"
              end
            end

            def install
              bin.install "tk"
            end

            test do
              system "#{bin}/tk", "--version"
            end
          end
          EOF
          git -C dist/tap add Formula/tk.rb
          git -C dist/tap -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "tk v$VERSION"
          git -C dist/tap push origin HEAD:main

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail

          # Download binaries built by the matrix from the new GitHub release
          mkdir -p dist/npm-dl
          gh release download "v$VERSION" --dir dist/npm-dl --pattern "*.tar.gz" --pattern "*.zip"

          # 1. Prepare all platform-specific packages
          while IFS=$'\t' read -r NPM_PLATFORM ARCHIVE BINNAME; do
            PKG_DIR="dist/npm-pkgs/${NPM_PLATFORM}"
            mkdir -p "${PKG_DIR}/bin"

            # Extract binary from archive
            TMPDIR=$(mktemp -d)
            if [[ "$ARCHIVE" == *.zip ]]; then
              unzip -q "dist/npm-dl/${ARCHIVE}" -d "$TMPDIR"
            else
              tar -xzf "dist/npm-dl/${ARCHIVE}" -C "$TMPDIR"
            fi
            BIN_PATH=$(find "$TMPDIR" -name "$BINNAME" -type f | head -1)
            cp "$BIN_PATH" "${PKG_DIR}/bin/${BINNAME}"
            [[ "$BINNAME" != *.exe ]] && chmod +x "${PKG_DIR}/bin/${BINNAME}"
            rm -rf "$TMPDIR"

            # Generate package.json
            OS="${NPM_PLATFORM%-*}"
            CPU="${NPM_PLATFORM##*-}"
            jq -n \
              --arg name "@nijaru/tk-${NPM_PLATFORM}" \
              --arg ver  "$VERSION" \
              --arg desc "tk binary for ${NPM_PLATFORM}" \
              --arg os   "$OS" \
              --arg cpu  "$CPU" \
              '{
                name: $name, version: $ver, description: $desc,
                os: [$os], cpu: [$cpu], license: "MIT",
                repository: {type: "git", url: "https://github.com/nijaru/tk.git"}
              }' > "${PKG_DIR}/package.json"
          done <<-'PLATFORMS'
          darwin-arm64	tk_darwin_arm64.tar.gz	tk
          darwin-x64	tk_darwin_amd64.tar.gz	tk
          linux-arm64	tk_linux_arm64.tar.gz	tk
          linux-x64	tk_linux_amd64.tar.gz	tk
          win32-x64	tk_windows_amd64.zip	tk.exe
          PLATFORMS

          # 2. Prepare main wrapper package @nijaru/tk
          MAIN_DIR="dist/npm-main"
          mkdir -p "${MAIN_DIR}/bin"
          cp npm/main/bin/tk.js "${MAIN_DIR}/bin/"
          chmod +x "${MAIN_DIR}/bin/tk.js"

          # Substitute version into package.json template
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' npm/main/package.json > "${MAIN_DIR}/package.json"

          # 3. Publish everything now that preparation is complete
          # (This minimizes the time between first and last publish)
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            npm publish "./dist/npm-pkgs/${platform}" --access public
          done
          npm publish "./${MAIN_DIR}" --access public
