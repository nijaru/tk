name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build and verify, no publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # --- Pre-flight: validate before any side effects ---

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be X.Y.Z (got: $VERSION)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Error: tag v$VERSION already exists"
            exit 1
          fi

      - name: Check version not already on GitHub releases
        run: |
          if gh release view "v$VERSION" --repo nijaru/tk &>/dev/null; then
            echo "Error: release v$VERSION already exists on GitHub"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Full CI suite ---

      - name: Build
        run: go build -ldflags "-X main.version=v$VERSION" -o tk .

      - name: Test
        run: go test ./...

      - name: Verify version flag
        run: |
          OUTPUT=$(./tk --version)
          if ! echo "$OUTPUT" | grep -qF "v$VERSION"; then
            echo "Error: binary reports '$OUTPUT', expected v$VERSION"
            exit 1
          fi

      # --- Release (GoReleaser creates the tag after successful publish) ---

      - name: Run GoReleaser
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --tag v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_UPDATE_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
