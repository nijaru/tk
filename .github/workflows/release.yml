name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build and verify, no publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install formatters
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/segmentio/golines@latest
          go install mvdan.cc/gofumpt@latest

      # --- Pre-flight: all checks before any side effects ---

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be X.Y.Z (got: $VERSION)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Error: tag v$VERSION already exists"
            exit 1
          fi

      - name: Check version not already on GitHub releases
        run: |
          if gh release view "v$VERSION" --repo nijaru/tk &>/dev/null; then
            echo "Error: release v$VERSION already exists on GitHub"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check npm version not already published
        run: |
          if npm view "@nijaru/tk@$VERSION" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "Error: @nijaru/tk@$VERSION is already published on npm"
            exit 1
          fi

      # --- Full CI suite (superset of ci.yml) ---

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code || { echo "Run 'make fmt' and commit the changes."; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags "-X main.version=v$VERSION" -o tk .

      - name: Test
        run: go test -race ./...

      - name: Verify version flag
        run: |
          OUTPUT=$(./tk --version)
          if ! echo "$OUTPUT" | grep -qF "v$VERSION"; then
            echo "Error: binary reports '$OUTPUT', expected v$VERSION"
            exit 1
          fi

      # --- Publish: GoReleaser → npm (tag is created locally first for GoReleaser) ---

      - name: Create local tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"

      - name: Run GoReleaser
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_UPDATE_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Download binaries built by GoReleaser from the new GitHub release
          mkdir -p dist/npm-dl
          gh release download "v$VERSION" --dir dist/npm-dl --pattern "*.tar.gz" --pattern "*.zip"

          # Publish each platform-specific package via npm trusted publishing (OIDC)
          # Columns: npm-platform  goreleaser-archive              binary-name
          while IFS=$'\t' read -r NPM_PLATFORM ARCHIVE BINNAME; do
            PKG_DIR="dist/npm-pkgs/${NPM_PLATFORM}"
            mkdir -p "${PKG_DIR}/bin"

            # Extract binary from archive
            TMPDIR=$(mktemp -d)
            if [[ "$ARCHIVE" == *.zip ]]; then
              unzip -q "dist/npm-dl/${ARCHIVE}" -d "$TMPDIR"
            else
              tar -xzf "dist/npm-dl/${ARCHIVE}" -C "$TMPDIR"
            fi
            BIN_PATH=$(find "$TMPDIR" -name "$BINNAME" -type f | head -1)
            cp "$BIN_PATH" "${PKG_DIR}/bin/${BINNAME}"
            [[ "$BINNAME" != *.exe ]] && chmod +x "${PKG_DIR}/bin/${BINNAME}"
            rm -rf "$TMPDIR"

            # Generate package.json
            OS="${NPM_PLATFORM%-*}"
            CPU="${NPM_PLATFORM##*-}"
            jq -n \
              --arg name "@nijaru/tk-${NPM_PLATFORM}" \
              --arg ver  "$VERSION" \
              --arg desc "tk binary for ${NPM_PLATFORM}" \
              --arg os   "$OS" \
              --arg cpu  "$CPU" \
              '{
                name: $name, version: $ver, description: $desc,
                os: [$os], cpu: [$cpu], license: "MIT",
                repository: {type: "git", url: "https://github.com/nijaru/tk.git"}
              }' > "${PKG_DIR}/package.json"

            npm publish "${PKG_DIR}" --access public --provenance
          done <<-'PLATFORMS'
          darwin-arm64	tk_darwin_arm64.tar.gz	tk
          darwin-x64	tk_darwin_amd64.tar.gz	tk
          linux-arm64	tk_linux_arm64.tar.gz	tk
          linux-x64	tk_linux_amd64.tar.gz	tk
          win32-x64	tk_windows_amd64.zip	tk.exe
          PLATFORMS

          # Publish main wrapper package @nijaru/tk
          MAIN_DIR="dist/npm-main"
          mkdir -p "${MAIN_DIR}/bin"
          cp npm/main/bin/tk.js "${MAIN_DIR}/bin/"
          chmod +x "${MAIN_DIR}/bin/tk.js"

          # Substitute version into package.json template
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' npm/main/package.json > "${MAIN_DIR}/package.json"

          npm publish "${MAIN_DIR}" --access public --provenance
